<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="images/B11-small.png" type="image/png">
  <title>Page not found · Tyme Boxed</title>
  <meta name="theme-color" content="#F4EFE6">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F4EFE6; --bg-card: #FBF8F2; --ink: #141414;
      --ink-soft: #5C5752; --line: #E0D8C7; --accent: #D6532B; --accent-d: #B8431F;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--ink);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh; display: grid; place-items: center;
      padding: 24px; text-align: center;
    }
    .code {
      font-family: 'Instrument Serif', Georgia, serif; font-style: italic;
      font-size: clamp(80px, 18vw, 160px); line-height: 1;
      color: var(--accent); letter-spacing: -0.02em;
    }
    h1 {
      font-weight: 800; font-size: clamp(24px, 4vw, 36px);
      letter-spacing: -0.025em; margin: 12px 0 10px;
    }
    p { color: var(--ink-soft); font-size: 16px; max-width: 420px; margin: 0 auto 28px; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--ink); color: var(--bg); text-decoration: none;
      padding: 14px 26px; border-radius: 999px;
      font-weight: 600; font-size: 15px;
      transition: background .15s ease;
    }
    .btn:hover { background: var(--accent); }
    .btn.ghost {
      background: transparent; color: var(--ink);
      border: 1.5px solid var(--line);
    }
    .btn.ghost:hover { border-color: var(--ink); background: transparent; }
    a:focus-visible { outline: 2px solid var(--accent-d); outline-offset: 3px; border-radius: 999px; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>This page wandered off.</h1>
    <p>Ironically, we couldn't stay focused either. The page you're looking for doesn't exist. The important ones do.</p>
    <div class="actions">
      <a class="btn" href="index.html">Back home</a>
      <a class="btn ghost" href="preorder.html">Order Tyme Boxed</a>
      <a class="btn ghost" href="support.html">Get help</a>
    </div>
  </main>
</body>
</html>
